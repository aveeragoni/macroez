name: Presets

# A preset is handed in as an issue made from the "Share a macro preset" form.
#  - Opened or edited: the file is checked. A clean preset is published straight away. One that does something
#    worth a second look (or a 4th upload from the same person in a day) waits for the owner.
#  - The owner adds "approved": it's published anyway.
#  - The owner adds "unpublish": it's taken off the site.
on:
  issues:
    types: [opened, edited, labeled]

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: presets
  cancel-in-progress: false

jobs:
  preset:
    if: >-
      startsWith(github.event.issue.title, 'Preset:') && (
        github.event.action == 'opened' || github.event.action == 'edited' ||
        (github.event.action == 'labeled' && github.event.sender.login == github.repository_owner &&
         (github.event.label.name == 'approved' || github.event.label.name == 'unpublish')))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow==11.0.0
      - name: Check, publish or take down
        continue-on-error: true
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
          EVENT: ${{ github.event.action }}
          LABEL: ${{ github.event.label.name }}
        run: |
          if [ "$EVENT" = "labeled" ] && [ "$LABEL" = "unpublish" ]; then action=unpublish
          elif [ "$EVENT" = "labeled" ]; then action=publish
          else action=auto; fi
          python .github/scripts/presets.py "$action"
      - name: Save and deploy
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.issue.number }}
        run: |
          decision=$(cat "$RUNNER_TEMP/decision.txt" 2>/dev/null || echo refused)
          gh label create preset --color 2dd4ea --description "A shared macro preset" --force
          gh label create published --color 3ddc97 --description "Listed on macroez.com/presets" --force
          gh label create approved --color 3ddc97 --description "Owner: publish this preset" --force
          gh label create unpublish --color ff5d6c --description "Owner: take this preset down" --force
          gh issue edit "$NUMBER" --add-label preset
          if [ "$decision" = "publish" ] || [ "$decision" = "removed" ]; then
            git config user.name "macroez-presets"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A presets
            git commit -m "Presets: $decision from issue #$NUMBER" || true
            git pull --rebase --quiet
            git push
            gh workflow run deploy.yml --ref main
          fi
          if [ "$decision" = "publish" ]; then
            gh issue edit "$NUMBER" --add-label published --remove-label unpublish || gh issue edit "$NUMBER" --add-label published || true
            gh issue close "$NUMBER" --reason completed || true
          elif [ "$decision" = "removed" ]; then
            gh issue edit "$NUMBER" --remove-label published --remove-label approved || true
          else
            gh issue edit "$NUMBER" --remove-label approved || true
          fi
          if [ -f "$RUNNER_TEMP/comment.md" ]; then gh issue comment "$NUMBER" --body-file "$RUNNER_TEMP/comment.md"; fi
