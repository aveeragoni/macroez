name: Presets

# A preset is handed in as an issue made from the "Share a macro preset" form.
#  - When it's opened or edited, the file is checked and a comment says what it does.
#  - When the repository owner adds the "approved" label, it's published to macroez.com/presets.
on:
  issues:
    types: [opened, edited, labeled]

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: presets
  cancel-in-progress: false

jobs:
  check:
    if: (github.event.action == 'opened' || github.event.action == 'edited') && startsWith(github.event.issue.title, 'Preset:')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow==11.0.0
      - name: Check the preset file
        id: check
        continue-on-error: true
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
        run: python .github/scripts/presets.py check
      - name: Comment and label
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.issue.number }}
        run: |
          gh label create preset --color 2dd4ea --description "A shared macro preset" --force
          gh label create approved --color 3ddc97 --description "Publish this preset to macroez.com" --force
          gh issue edit "$NUMBER" --add-label preset
          gh issue comment "$NUMBER" --body-file "$RUNNER_TEMP/comment.md"

  publish:
    if: github.event.action == 'labeled' && github.event.label.name == 'approved' && github.event.sender.login == github.repository_owner && startsWith(github.event.issue.title, 'Preset:')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow==11.0.0
      - name: Add the preset to the website
        id: publish
        continue-on-error: true
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
        run: python .github/scripts/presets.py publish
      - name: Save and deploy
        if: steps.publish.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.issue.number }}
        run: |
          git config user.name "macroez-presets"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add presets
          git commit -m "Add preset $(cat "$RUNNER_TEMP/preset_id.txt") from issue #$NUMBER"
          git push
          gh workflow run deploy.yml --ref main
          gh issue comment "$NUMBER" --body-file "$RUNNER_TEMP/comment.md"
          gh issue close "$NUMBER" --reason completed
      - name: Explain what went wrong
        if: steps.publish.outcome != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue edit "$NUMBER" --remove-label approved
          if [ -f "$RUNNER_TEMP/comment.md" ]; then gh issue comment "$NUMBER" --body-file "$RUNNER_TEMP/comment.md"; fi
